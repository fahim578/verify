<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Watch Ad to Unlock</title>
<script src="https://libtl.com/sdk.js" data-zone="9900692" data-sdk="show_9900692"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:#0e1621;color:#fff;min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:24px}
.card{background:#17212b;border-radius:18px;padding:32px 24px;max-width:420px;
width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.45)}
h1{font-size:22px;margin-bottom:8px}
p{color:#8fa3b8;font-size:15px;line-height:1.6;margin-bottom:20px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;
background:#2ea6ff;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn:disabled{background:#2b3a4a;color:#7a8fa3;cursor:not-allowed}
.note{font-size:13px;color:#6b8299;margin-top:16px;line-height:1.5}
.state{font-size:16px;font-weight:600;padding:14px;border-radius:12px;margin-top:18px}
.ok{background:#1b3a2a;color:#4ade80}
.bad{background:#3a1b1b;color:#f87171}
.wait{background:#3a321b;color:#fbbf24}
</style>
</head>
<body>
<div class="card">
  <h1>📺 Watch the ad</h1>
  <p id="sub">The ad must be watched until the end. Only then is it counted.</p>
  <button class="btn" id="go">▶ Watch Ad</button>
  <div class="state wait" id="state" style="display:none"></div>
  <p class="note" id="note">After the ad, go back to Telegram — the code unlocks by itself.</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var token = q.get("t") || "";
  var cb = q.get("cb") || "";
  var go = document.getElementById("go");
  var state = document.getElementById("state");
  var sub = document.getElementById("sub");
  var busy = false;
  var rewarded = false;

  function say(text, cls) {
    state.style.display = "block";
    state.className = "state " + cls;
    state.textContent = text;
  }

  function report() {
    if (!cb || !token) {
      say("⚠️ This page was opened without a bot session. Open it from Telegram.", "bad");
      return;
    }
    say("⏳ Counting the ad…", "wait");
    var url = cb + (cb.indexOf("?") >= 0 ? "&" : "?") + "t=" + encodeURIComponent(token);
    fetch(url, { method: "GET", mode: "cors" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && (d.ok === true || d.verified === true)) {
          say("✅ Ad counted! Go back to Telegram.", "ok");
          sub.textContent = "Your promo code progress was updated.";
        } else if (d && d.error === "too fast") {
          say("⏱ Ad too short. Watch it fully next time.", "bad");
        } else if (d && d.error) {
          say("⚠️ " + d.error, "bad");
        } else {
          say("⚠️ Not counted. Try again.", "bad");
        }
        go.disabled = false;
        go.textContent = "▶ Watch another ad";
      })
      .catch(function () {
        say("⚠️ Network problem. Go back to Telegram and check 📊 Progress.", "bad");
        go.disabled = false;
      });
  }

  function start() {
    if (busy) return;
    busy = true;
    rewarded = false;
    go.disabled = true;
    go.textContent = "Loading ad…";
    say("⏳ Opening the ad…", "wait");

    var fn = window["show_9900692"];
    if (typeof fn !== "function") {
      busy = false;
      go.disabled = false;
      go.textContent = "▶ Watch Ad";
      say("⚠️ Ad not ready. Reload this page.", "bad");
      return;
    }

    function won() {
      if (rewarded) return;
      rewarded = true;
      busy = false;
      report();
    }

    var res;
    try {
      res = fn({
        type: "rewarded",
        callback: won,
        onReward: won,
        onClose: function () {
          setTimeout(function () {
            if (!rewarded) {
              busy = false;
              go.disabled = false;
              go.textContent = "▶ Watch Ad";
              say("❌ Ad was skipped — not counted.", "bad");
            }
          }, 1500);
        }
      });
    } catch (e) {
      busy = false;
      go.disabled = false;
      go.textContent = "▶ Watch Ad";
      say("⚠️ Could not open the ad. Reload and try again.", "bad");
      return;
    }

    if (res && typeof res.then === "function") {
      res.then(function () { won(); }, function () {
        busy = false;
        go.disabled = false;
        go.textContent = "▶ Watch Ad";
        say("❌ Ad was not completed — not counted.", "bad");
      });
    }
  }

  go.addEventListener("click", start);

  if (!token) {
    say("⚠️ Open this page from the bot, not directly.", "bad");
    go.disabled = true;
  }
})();
</script>
</body>
</html>
